<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <title>Document</title>
</head>

<body data-bs-theme="dark">

    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"> <!-- medium is default -->
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="myModalLabel">Modal Title</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Modal body content goes here.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>
    <div id="center_stage" class="bg-dark text-white">

        <form>
            <fieldset class="container">
                <fieldset id="" class="container">
                    <!-- Controls of the Applications -->
                    <div class="input-group mb-3">
                        <!-- Todo input: text -->
                        <input id="todo-input-text" type="text" class="form-control" placeholder="Enter A Task" aria-label="Enter A Task"
                            aria-describedby="button-addon2">

                        <!-- Todo input: button -->
                        <input id="todo-input-button" type="button" value="Add Task" class="btn btn-primary">
                    </div>

                </fieldset>
                <fieldset id="" class="container">
                    <div class="input-group">
                        <input type="text" class="form-control" aria-label="Text input with segmented dropdown button">
                        <div class="input-group-text">
                            <input class="form-check-input mt-0" type="checkbox" value=""
                                aria-label="Checkbox for following text input">
                        </div>
                        <input type="button" class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split"
                            data-bs-toggle="dropdown" aria-expanded="false" value="▼" aria-label="Toggle Dropdown">
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><input type="button" class="dropdown-item" value="Delete"></li>
                            <li><input type="button" class="dropdown-item" value="Edit" data-bs-toggle="modal"
                                    data-bs-target="#myModal"></li>
                        </ul>
                    </div>
                </fieldset>

            </fieldset>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>


    <script src="./applet/UIView/TodoUIView.js"></script>
    <script src="./applet/Controller/TodoController.js"></script>


    <script src="./applet/app.js"></script>
</body>

</html>
